<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApexMoto • High-Performance Motorcycle Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

<style>
  :root {
    --accent: #ff3344;
    --accent-glow: rgba(255, 51, 68, 0.45);
    --accent-gradient: linear-gradient(135deg, #ff3344 0%, #ff6b3d 100%);
    --bg-dark: #090b0f;
    --bg-surface: #131722;
    --bg-glass: rgba(19, 23, 34, 0.85);
    --card-bg: rgba(22, 28, 42, 0.9);
    --border: rgba(255, 255, 255, 0.08);
    --border-highlight: rgba(255, 51, 68, 0.35);
    --text-primary: #f0f4f8;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --user-bubble: linear-gradient(135deg, #ff3344 0%, #d91b2e 100%);
    --shadow-main: 0 14px 34px -10px rgba(0, 0, 0, 0.65);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg-dark);
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    position: relative;
    background-image: 
      radial-gradient(circle at 10% 15%, rgba(255, 51, 68, 0.14) 0%, transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(255, 107, 61, 0.1) 0%, transparent 45%),
      linear-gradient(to bottom, rgba(9, 11, 15, 0.95), rgba(9, 11, 15, 1));
  }

  /* Header Bar */
  header {
    background: var(--bg-glass);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
    padding: 0.85rem 1.8rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    text-decoration: none;
  }

  .brand-logo {
    width: 38px;
    height: 38px;
    background: var(--accent-gradient);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 15px var(--accent-glow);
    animation: pulseGlow 3s infinite ease-in-out;
  }

  .brand-logo span {
    font-size: 22px;
    color: #fff;
  }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 15px var(--accent-glow); }
    50% { box-shadow: 0 0 25px rgba(255, 51, 68, 0.7); }
  }

  .brand-title {
    font-weight: 800;
    font-size: 1.25rem;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 40%, #ff8b95 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .brand-badge {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    background: rgba(255, 51, 68, 0.15);
    color: #ff5264;
    padding: 0.2rem 0.5rem;
    border-radius: 999px;
    border: 1px solid rgba(255, 51, 68, 0.3);
  }

  .header-status {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    color: var(--text-secondary);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 8px #10b981;
    animation: blink 2s infinite ease-in-out;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Dialogue / Chat Stream */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1.25rem;
    max-width: 880px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    scroll-behavior: smooth;
  }

  #log::-webkit-scrollbar {
    width: 6px;
  }
  #log::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 3px;
  }

  /* Dialogue Item Container with Avatar & Meta */
  .dialogue-turn {
    display: flex;
    gap: 0.85rem;
    align-items: flex-start;
    animation: fadeInSlide 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .dialogue-turn.user {
    flex-direction: row-reverse;
  }

  @keyframes fadeInSlide {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dialogue-avatar {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .dialogue-turn.agent .dialogue-avatar {
    background: var(--accent-gradient);
    box-shadow: 0 0 12px var(--accent-glow);
    color: #fff;
  }

  .dialogue-turn.user .dialogue-avatar {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid var(--border);
    color: #e2e8f0;
  }

  .dialogue-content {
    display: flex;
    flex-direction: column;
    max-width: 84%;
  }

  .dialogue-turn.user .dialogue-content {
    align-items: flex-end;
  }

  .dialogue-turn.agent .dialogue-content {
    align-items: flex-start;
  }

  .dialogue-meta {
    font-size: 0.72rem;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 0.35rem;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .bubble {
    display: inline-block;
    padding: 1rem 1.35rem;
    border-radius: 18px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    color: var(--text-primary);
    text-align: left;
    line-height: 1.6;
    font-size: 0.96rem;
    white-space: pre-wrap;
    box-shadow: var(--shadow-main);
  }

  .dialogue-turn.user .bubble {
    background: var(--user-bubble);
    color: #ffffff;
    border: none;
    border-top-right-radius: 4px;
    font-weight: 500;
  }

  .dialogue-turn.agent .bubble {
    border-top-left-radius: 4px;
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  /* 3 Clickable Example Prompts Row */
  .example-prompts-row {
    max-width: 880px;
    width: 100%;
    margin: 0 auto;
    padding: 0 1.25rem 0.75rem 1.25rem;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
  }

  .example-prompt-btn {
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 0.75rem 0.9rem;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    text-align: left;
    backdrop-filter: blur(10px);
  }

  .example-prompt-btn .prompt-badge {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.75rem;
    font-weight: 700;
    color: #ff5264;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .example-prompt-btn .prompt-text {
    font-size: 0.81rem;
    color: var(--text-secondary);
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .example-prompt-btn:hover {
    background: rgba(255, 51, 68, 0.12);
    border-color: var(--border-highlight);
    transform: translateY(-2px);
    box-shadow: 0 4px 18px rgba(255, 51, 68, 0.25);
  }

  .example-prompt-btn:hover .prompt-text {
    color: #fff;
  }

  @media (max-width: 680px) {
    .example-prompts-row {
      grid-template-columns: 1fr;
      gap: 0.5rem;
    }
  }

  /* Input Form */
  form {
    display: flex;
    gap: 0.75rem;
    padding: 1.1rem 1.5rem;
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    max-width: 880px;
    width: 100%;
    margin: 0 auto;
    border-radius: 16px 16px 0 0;
  }

  .input-wrapper {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }

  input {
    width: 100%;
    padding: 0.95rem 1.25rem;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 0.95rem;
    color: #fff;
    outline: none;
    transition: all 0.25s ease;
  }

  input:focus {
    border-color: var(--accent);
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 18px rgba(255, 51, 68, 0.3);
  }

  input::placeholder {
    color: var(--text-muted);
  }

  button.send-btn {
    padding: 0.85rem 1.4rem;
    border: none;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #fff;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: 0 4px 15px rgba(255, 51, 68, 0.35);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  button.send-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 51, 68, 0.55);
  }

  button.send-btn:active {
    transform: translateY(0);
  }

  /* --- A2UI Card Styling --- */
  .a2card {
    background: linear-gradient(145deg, rgba(26, 32, 46, 0.9) 0%, rgba(18, 22, 31, 0.95) 100%);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 1.4rem;
    box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
    margin-top: 0.5rem;
    position: relative;
    overflow: hidden;
  }

  .a2card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 4px;
    height: 100%;
    background: var(--accent-gradient);
  }

  .a2card + .a2card, .a2col > .a2card { margin-top: 0.85rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.6rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; color: #fff; }
  .a2text.a2-h2 { font-size: 1.25rem; font-weight: 700; color: #ff6b3d; letter-spacing: -0.01em; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: #f87171; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; color: var(--text-secondary); }
  .a2text.a2-caption { font-size: 0.82rem; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; }
  .a2text.a2-body { font-size: 0.92rem; color: #cbd5e1; }
  
  .a2divider { border: none; border-top: 1px solid rgba(255, 255, 255, 0.08); margin: 0.6rem 0; width: 100%; }
  
  .a2img {
    max-width: 100%;
    border-radius: 12px;
    display: block;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.12);
    transition: transform 0.3s ease;
  }
  .a2img:hover {
    transform: scale(1.015);
  }

  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-size: 1.3rem;
    line-height: 1;
    vertical-align: middle;
    color: var(--accent);
  }

  /* Typing Indicator Animation */
  .typing-indicator {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 10px;
  }
  .typing-dot {
    width: 6px;
    height: 6px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: typingBounce 1.4s infinite ease-in-out both;
  }
  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; background: var(--accent); }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">
      <span class="material-symbols-outlined">two_wheeler</span>
    </div>
    <span class="brand-title">ApexMoto</span>
    <span class="brand-badge">PRO v1.0</span>
  </div>
  <div class="header-status">
    <div class="status-dot"></div>
    <span>Engine Online</span>
  </div>
</header>

<div id="log"></div>

<div class="example-prompts-row">
  <button type="button" class="example-prompt-btn" onclick="sendQuick('Show me the best twisty motorcycle routes in California with a twistiness rating above 8')">
    <div class="prompt-badge">
      <span class="material-symbols-outlined" style="font-size:16px;">route</span> Route Finder
    </div>
    <div class="prompt-text">&ldquo;Show me best CA twisties with twistiness &gt; 8&rdquo;</div>
  </button>

  <button type="button" class="example-prompt-btn" onclick="sendQuick('Where are Marcus and Elena riding right now? Check their road and telemetry.')">
    <div class="prompt-badge">
      <span class="material-symbols-outlined" style="font-size:16px;">groups</span> Crew Radar
    </div>
    <div class="prompt-text">&ldquo;Where are Marcus &amp; Elena riding right now?&rdquo;</div>
  </button>

  <button type="button" class="example-prompt-btn" onclick="sendQuick('Calculate the lean angle needed for a 45 mph corner on a 150 ft radius turn, and check current weather on Mulholland')">
    <div class="prompt-badge">
      <span class="material-symbols-outlined" style="font-size:16px;">speed</span> Physics &amp; Weather
    </div>
    <div class="prompt-text">&ldquo;Calculate 45mph lean angle on 150ft turn &amp; weather&rdquo;</div>
  </button>
</div>

<form id="form">
  <div class="input-wrapper">
    <input id="input" placeholder="Ask ApexMoto about twisty roads, crew status, weather, or bike telemetry…" autocomplete="off" autofocus>
  </div>
  <button class="send-btn">
    <span>Send</span>
    <span class="material-symbols-outlined" style="font-size: 18px; color: #fff;">arrow_upward</span>
  </button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { 
  const e = document.createElement(tag); 
  if (cls) e.className = cls; 
  if (text != null) e.textContent = text; 
  return e; 
}

function bubble(who) {
  const turn = el("div", "dialogue-turn " + who);
  
  const avatar = el("div", "dialogue-avatar");
  const icon = el("span", "material-symbols-outlined");
  icon.textContent = who === "agent" ? "smart_toy" : "person";
  if (who === "agent") icon.style.color = "#ffffff";
  avatar.appendChild(icon);
  turn.appendChild(avatar);

  const content = el("div", "dialogue-content");
  
  const meta = el("div", "dialogue-meta");
  meta.textContent = who === "agent" ? "ApexMoto AI" : "Rider";
  content.appendChild(meta);

  const b = el("div", "bubble");
  content.appendChild(b);
  turn.appendChild(content);

  log.appendChild(turn); 
  log.scrollTop = log.scrollHeight;
  return b;
}

function showTypingIndicator() {
  const turn = el("div", "dialogue-turn agent typing");
  
  const avatar = el("div", "dialogue-avatar");
  const icon = el("span", "material-symbols-outlined");
  icon.textContent = "smart_toy";
  icon.style.color = "#ffffff";
  avatar.appendChild(icon);
  turn.appendChild(avatar);

  const content = el("div", "dialogue-content");
  const meta = el("div", "dialogue-meta");
  meta.textContent = "ApexMoto AI • Telemetry Computing...";
  content.appendChild(meta);

  const b = el("div", "bubble");
  const ind = el("div", "typing-indicator");
  ind.appendChild(el("div", "typing-dot"));
  ind.appendChild(el("div", "typing-dot"));
  ind.appendChild(el("div", "typing-dot"));
  b.appendChild(ind);
  content.appendChild(b);
  turn.appendChild(content);

  log.appendChild(turn);
  log.scrollTop = log.scrollHeight;
  return turn;
}

// Initial welcome message from ApexMoto
window.addEventListener("DOMContentLoaded", () => {
  const b = bubble("agent");
  b.textContent = "Welcome to ApexMoto. 🏍️\n\nYour high-performance motorcycle route concierge and riding assistant is online. Explore iconic twisty passes, track crew telemetry, check mountain tarmac weather, compute lean angle physics in the sandbox, or generate route artwork.\n\nChoose a quick action above or enter your ride destination:";
});

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply).
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { 
  return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); 
}

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const e = el("div", "a2card");
      kids().forEach(k => e.appendChild(k));
      return e;
    }
    case "Column": {
      const e = el("div", "a2col");
      kids().forEach(k => e.appendChild(k));
      return e;
    }
    case "Row": {
      const e = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(k => e.appendChild(k));
      return e;
    }
    case "Text": {
      const hint = String(props.usageHint || "body").toLowerCase();
      const tag = hint === "h1" ? "h1" : hint === "h2" ? "h2" : hint === "h3" ? "h3" : hint === "h4" ? "h4" : "p";
      return el(tag, "a2text a2-" + hint, boundStr(props.text));
    }
    case "Divider":
      return el("hr", "a2divider");
    case "List": {
      const e = el("div", "a2col");
      kids().forEach(k => e.appendChild(k));
      return e;
    }
    case "Image": {
      const url = boundStr(props.url);
      if (/^https?:\/\//i.test(url)) {
        const img = el("img", "a2img");
        img.src = url;
        img.alt = boundStr(props.accessibilityLabel) || "Generated ride visual";
        img.loading = "lazy";
        return img;
      }
      return el("p", "a2text a2-caption", "(Image stored in Cloud Storage)");
    }
    case "Icon": {
      const name = iconName(boundStr(props.name));
      const icon = el("span", "material-symbols-outlined", name);
      icon.title = name;
      return icon;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    const br = m.beginRendering;
    if (br && typeof br.root === "string") roots.push(br.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) {
      for (const c of su.components) {
        if (c && typeof c.id === "string" && c.component) comps[c.id] = c.component;
      }
    }
  }
  let rootIds = roots.filter(r => r in comps);
  if (!rootIds.length) {
    const referenced = new Set();
    for (const id in comps) { 
      const spec = comps[id]; 
      childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); 
    }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { 
    const node = buildNode(rid, comps, new Set()); 
    if (node) { container.appendChild(node); drew = true; } 
  }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) {
      for (const c of su.components) {
        if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
      }
    }
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) {
      b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
    }
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

async function handleSendMessage(text) {
  bubble("user").textContent = text;
  const typingNode = showTypingIndicator();
  try {
    const res = await fetch("/chat", { 
      method: "POST", 
      headers: { "Content-Type": "application/json" }, 
      body: JSON.stringify({ message: text }) 
    });
    const raw = await res.text();
    typingNode.remove();
    const b = bubble("agent");
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server error: ${raw.slice(0, 200)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    typingNode.remove();
    const b = bubble("agent");
    b.textContent = "Error: " + e.message;
  }
}

function sendQuick(promptText) {
  handleSendMessage(promptText);
}

form.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  handleSendMessage(text);
});
</script>
